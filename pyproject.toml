[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanorag"
version = "0.1.0"
description = "Retrieval-Augmented Generation from scratch: chunking, hashed embeddings, BM25 + vector hybrid retrieval with RRF fusion, pluggable LLM providers, and golden-set evals. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Oussema Braham" }]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "llm",
    "ai-engineering",
    "bm25",
    "vector-search",
    "embeddings",
    "hybrid-search",
    "information-retrieval",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nanorag = "nanorag.cli:main"

[tool.setuptools]
packages = ["nanorag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
